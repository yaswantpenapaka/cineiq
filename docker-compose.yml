services:
  # FastAPI Backend (Inference API only - Memory optimized)
  api:
    build: .
    container_name: cineiq-api
    ports:
      - "8000:8000"
    volumes:
      - ./data/merged_movies.csv:/app/data/merged_movies.csv:ro
      - ./data/movielens/ratings.csv:/app/data/movielens/ratings.csv:ro
      - ./models/svd_model.pkl:/app/models/svd_model.pkl:ro
      - ./feedback:/app/feedback
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - cineiq-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Memory limit: 2GB (reduced from 7.6GB needed for 2 containers)
    mem_limit: 2g
    memswap_limit: 2g

  # Note: Streamlit runs locally, not in Docker!
  # See DOCKER_SETUP.md for running Streamlit locally

networks:
  cineiq-network:
    driver: bridge
