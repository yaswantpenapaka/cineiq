services:
  # FastAPI Backend
  api:
    build: .
    container_name: cineiq-api
    ports:
      - "8000:8000"
    volumes:
      - ./data/merged_movies.csv:/app/data/merged_movies.csv:ro
      - ./data/movielens/ratings.csv:/app/data/movielens/ratings.csv:ro
      - ./models/svd_model.pkl:/app/models/svd_model.pkl:ro
      - ./feedback:/app/feedback
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    networks:
      - cineiq-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Streamlit Frontend
  streamlit:
    build: .
    container_name: cineiq-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./data/merged_movies.csv:/app/data/merged_movies.csv:ro
      - ./data/movielens/ratings.csv:/app/data/movielens/ratings.csv:ro
      - ./models/svd_model.pkl:/app/models/svd_model.pkl:ro
      - ./feedback:/app/feedback
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    command: streamlit run app/app.py --logger.level=debug
    networks:
      - cineiq-network
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  cineiq-network:
    driver: bridge
